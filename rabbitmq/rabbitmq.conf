# Configuração do RabbitMQ do tutorial (montada em /etc/rabbitmq/conf.d/).
#
# consumer_timeout: por padrão o RabbitMQ derruba o consumidor que segura uma
# mensagem sem confirmar (ack) por mais de 30 minutos. No tutorial, um evento
# fica de propósito "Unacked" até você escrever o tratador, o que pode levar
# mais tempo. Aqui o limite vira 24 horas.
consumer_timeout = 86400000

# Permite usar o usuário padrão guest/guest de fora do container (só para estudo).
loopback_users.guest = false
