# Ambiente do tutorial Saga Coreografada.
#   pedidos    -> inicia a saga          (http://localhost:8031)
#   estoque    -> reserva / libera       (http://localhost:8032)
#   pagamentos -> cobra o cliente        (http://localhost:8033)
#   rabbitmq   -> barramento de eventos  (painel: http://localhost:15672, usuário e senha: guest)
#                 Não há orquestrador!
name: tutorial-saga-coreografada

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq                # o RabbitMQ guarda os dados pelo nome do host
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-tutorial.conf:ro
    ports:
      - "15672:15672"                 # painel de gerenciamento (filas, exchanges, mensagens)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  pedidos:
    build: ./servicos
    restart: unless-stopped   # se um erro de digitação derrubar o serviço, ele volta assim que você corrigir
    volumes:
      - ./servicos/pedidos:/app      # código montado: ao salvar, o serviço recarrega
      - ./servicos/comum:/comum
      - dados-pedidos:/dados         # banco de dados PRÓPRIO do serviço
    environment:
      PYTHONPATH: /comum
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      ARQUIVO_ESTADO: /dados/pedidos.json
    ports:
      - "8031:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      rabbitmq:
        condition: service_healthy

  estoque:
    build: ./servicos
    restart: unless-stopped
    volumes:
      - ./servicos/estoque:/app      # código montado: ao salvar, o serviço recarrega
      - ./servicos/comum:/comum
      - dados-estoque:/dados         # banco de dados PRÓPRIO do serviço
    environment:
      PYTHONPATH: /comum
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      ARQUIVO_ESTADO: /dados/estoque.json
    ports:
      - "8032:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      rabbitmq:
        condition: service_healthy

  pagamentos:
    build: ./servicos
    restart: unless-stopped
    volumes:
      - ./servicos/pagamentos:/app      # código montado: ao salvar, o serviço recarrega
      - ./servicos/comum:/comum
      - dados-pagamentos:/dados         # banco de dados PRÓPRIO do serviço
    environment:
      PYTHONPATH: /comum
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      ARQUIVO_ESTADO: /dados/pagamentos.json
    ports:
      - "8033:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  dados-pedidos:
  dados-estoque:
  dados-pagamentos:
